{% if page.lang == "zh-CN" %}
  {% assign visitor_map_title = "访问统计" %}
{% else %}
  {% assign visitor_map_title = "Live visitor stats" %}
{% endif %}

<div class="page__visitor-map">
  <div class="page__visitor-map-title">{{ visitor_map_title }}</div>
  <iframe
    class="page__visitor-map-frame"
    src="https://s01.flagcounter.com/more/EQO"
    title="{{ visitor_map_title }}"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
